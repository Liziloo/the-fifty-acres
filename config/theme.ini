[info]
name         = "The Fifty Acres"
version      = "1.0"
author       = "Liz Casler Loomans"
description  = "A custom scrapbook-style theme with fixed sidebar and hero banner."
theme_link   = "https://github.com/Liziloo/the-fifty-acres"
author_link  = "https://thefiftyacres.com/"
omeka_version_constraint = "^4.2.0"

[config]
elements.logo.name = "logo"
elements.logo.type = "Omeka\Form\Element\Asset"
elements.logo.options.label = "Logo"

elements.footer.name = "footer"
elements.footer.attributes.id = "footer"
elements.footer.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer.options.label = "Footer Content"
elements.footer.options.info = "HTML content to appear in the footer"
elements.footer.attributes.value = "Powered by Omeka S"

[resource_page_regions]
items.main = "Main Content"
items.sidebar = "Scrapbook Sidebar"
item_sets.main = "Main Content"
media.main = "Main Content"

[resource_page_blocks]
; Default blocks for the sidebar (usually metadata)
items.sidebar[] = "values"

; Default blocks for the main area
items.main[] = "mediaEmbeds"
items.main[] = "itemSets"
items.main[] = "mediaList"
items.main[] = "linkedResources"

item_sets.main[] = "values"
media.main[] = "mediaRender"
media.main[] = "values"